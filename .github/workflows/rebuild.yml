name: Rebuild

# Rebuilds the latest release's image when one of its base images has moved,
# so Debian and Node fixes reach the X.Y and latest tags without a new
# release. X.Y.Z tags stay exactly as released.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC, off the hour when GitHub is busiest
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if no base image has moved
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rebuild
  cancel-in-progress: false

env:
  IMAGE: reggarantai/api-contract-builder

jobs:
  check:
    name: Check the base images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      minor: ${{ steps.release.outputs.minor }}
      changed: ${{ steps.base.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)
          version=${tag#v}
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "minor=${version%.*}"
          } >> "${GITHUB_OUTPUT}"
      - name: Compare its base images with the registry
        id: base
        env:
          MINOR: ${{ steps.release.outputs.minor }}
        run: |
          changed=$(node scripts/base-images.ts "${IMAGE}:${MINOR}" 2> comparison.txt)
          cat comparison.txt
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Base images of ${IMAGE}:${MINOR}"
            echo '```'
            cat comparison.txt
            echo '```'
            echo "Rebuild needed: ${changed}"
          } >> "${GITHUB_STEP_SUMMARY}"

  rebuild:
    name: Rebuild and publish
    needs: check
    if: needs.check.outputs.changed == 'true' || inputs.force
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The Docker Hub token is a secret of this environment; only this job can
    # read it, and only when there's something to publish.
    environment:
      name: DOCKERHUB_TOKEN
      url: https://hub.docker.com/r/reggarantai/api-contract-builder
    # Never at the same time as a release: both publish latest.
    concurrency:
      group: docker-hub
      cancel-in-progress: false
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      MINOR: ${{ needs.check.outputs.minor }}
    steps:
      # The release as it was tagged, so only the base images change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both platforms are tested before anything is pushed: these tags are
      # what people pull.
      - name: Build for linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: rebuild:amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build for linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          pull: true
          load: true
          tags: rebuild:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test both platforms
        run: |
          scripts/smoke-test-image.sh rebuild:amd64 linux/amd64
          SMOKE_PORT=3201 scripts/smoke-test-image.sh rebuild:arm64 linux/arm64
      - name: Scan for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rebuild:amd64
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Make sure this is still the latest release
        id: still-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)
          if [ "${latest}" != "${TAG}" ]; then
            echo "::notice::${latest} came out during the rebuild of ${TAG}; leaving its tags alone"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Describe the image
        id: meta
        if: steps.still-latest.outputs.publish == 'true'
        run: |
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.still-latest.outputs.publish == 'true'
        with:
          username: reggarantai
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish X.Y and latest
        if: steps.still-latest.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.MINOR }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.url=https://github.com/reggarantai/api-contract-builder
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Summarize
        if: steps.still-latest.outputs.publish == 'true'
        run: |
          echo "Rebuilt ${TAG} and published ${IMAGE}:${MINOR} and ${IMAGE}:latest; ${IMAGE}:${VERSION} is unchanged." >> "${GITHUB_STEP_SUMMARY}"
