                      id: 0b5c2d4e-8f1a-4b3c-9d2e-7a6f5e4d3c2b
                      name: Ana Lima
                    createdAt: 2026-10-28T14:05:00Z
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                missing-key:
                  value:
                    type: https://api.inventory.example/problems/idempotency-key-missing
                    title: Idempotency-Key missing
                    status: 400
                    detail: Send an Idempotency-Key header with each create.
                key-reused:
                  value:
                    type: https://api.inventory.example/problems/idempotency-key-reused
                    title: Idempotency-Key reused
                    status: 400
                    detail: This key was already used for a different request. Make a new one.
        "401":
          description: Unauthorized
          headers:
            WWW-Authenticate:
              required: true
              description: The Bearer challenge (RFC 6750). It adds `error="invalid_token"` when the token sent is expired or invalid.
              schema:
                type: string
                examples:
                  - Bearer realm="inventory", error="invalid_token", error_description="The access token expired"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                token-expired:
                  value:
                    type: https://api.inventory.example/problems/token-expired
                    title: Access token expired
                    status: 401
                    detail: Refresh the access token and try again.
                unauthenticated:
                  value:
                    type: https://api.inventory.example/problems/unauthenticated
                    title: Not signed in
                    status: 401
                    detail: Send an access token in the Authorization header.
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                not-found:
                  value:
                    type: https://api.inventory.example/problems/not-found
                    title: Not found
                    status: 404
                    detail: There's no stock item with ID 9d0c8b7a-6f5e-4d3c-8b2a-1f0e9d8c7b6a.
        "409":
          description: Conflict
          headers:
            Retry-After:
              description: "Only with `request-in-progress`: seconds before resending"
              schema:
                type: integer
                minimum: 1
                examples:
                  - 2
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                not-enough-stock:
                  value:
                    type: https://api.inventory.example/problems/insufficient-stock
                    title: Not enough stock
                    status: 409
                    detail: Only 18 on hand, so 30 can't be issued.
                in-progress:
                  value:
                    type: https://api.inventory.example/problems/request-in-progress
                    title: Request in progress
                    status: 409
                    detail: A request with this Idempotency-Key is still running. Resend it later.
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
              examples:
                zero-receipt:
                  value:
                    type: https://api.inventory.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields are invalid.
                    errors:
                      - pointer: "#/quantity"
                        detail: Receive at least 1.
      x-status: review
      x-notes-be: Lock the item while recording, so two issues at the same time can't take the quantity below 0.
      x-pages:
        - page: Stock item
          slug: stock-item
          trigger: on_submit
          note: Record movement dialog. One `Idempotency-Key` per dialog, until it saves
components:
  schemas:
    Category:
      description: A group of stock items, like Packaging.
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 60
      required:
        - id
        - name
    PageMeta:
      description: Where a page of results sits in the whole list.
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          description: The page number
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: Items per page
        totalItems:
          type: integer
          minimum: 0
          description: Items in the whole list
        totalPages:
          type: integer
          minimum: 0
          description: 0 when the list is empty
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
    Problem:
      description: An error, as RFC 9457 problem details. Branch on `type`, not on `title` or `detail`.
      type: object
      properties:
        type:
          type: string
          format: uri
          description: "Identifies the kind of problem. It's stable: branch on it."
          examples:
            - https://api.inventory.example/problems/not-found
        title:
          type: string
          description: Short summary of the kind of problem
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code
        detail:
          type: string
          description: What went wrong this time, in words for people
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence. Quote it when reporting a problem.
      required:
        - type
        - title
        - status
    Session:
      description: "An access token. The refresh token isn't in the body: it's in the `refresh_token` cookie, which scripts can't read."
      type: object
      properties:
        accessToken:
          type: string
          description: "Send as `Authorization: Bearer <token>`. Keep it in memory only."
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the access token expires
          examples:
            - 900
      required:
        - accessToken
        - tokenType
        - expiresIn
    StockItem:
      description: Something the warehouse keeps in stock. Its quantity only changes through stock movements.
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          pattern: ^[A-Z0-9-]{3,32}$
          description: "Stock keeping unit: upper-case letters, digits, and hyphens. Unique among items that aren't deleted."
          examples:
            - BOX-S-001
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - "null"
          maxLength: 2000
        category:
          $ref: "#/components/schemas/Category"
        unit:
          type: string
          enum:
            - piece
            - box
            - roll
            - pack
          description: What quantities count. It can't change once the item has stock movements.
        quantityOnHand:
          type: integer
          minimum: 0
        reorderPoint:
          type: integer
          minimum: 0
          maximum: 1000000
          description: At or below this quantity, the item is low on stock
        stockStatus:
          type: string
          enum:
            - in_stock
            - low_stock
            - out_of_stock
          description: "`out_of_stock` at 0; `low_stock` at or below `reorderPoint`"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sku
        - name
        - description
        - category
        - unit
        - quantityOnHand
        - reorderPoint
        - stockStatus
        - createdAt
        - updatedAt
    StockItemInput:
      description: "A new stock item. It starts with 0 on hand: record a receipt to add stock."
      type: object
      properties:
        sku:
          type: string
          pattern: ^[A-Z0-9-]{3,32}$
          description: "Stock keeping unit: upper-case letters, digits, and hyphens. Unique among items that aren't deleted."
          examples:
            - BOX-S-001
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - "null"
          maxLength: 2000
        categoryId:
          type: string
          format: uuid
        unit:
          type: string
          enum:
            - piece
            - box
            - roll
            - pack
          description: What quantities count. It can't change once the item has stock movements.
        reorderPoint:
          type: integer
          minimum: 0
          maximum: 1000000
          description: At or below this quantity, the item is low on stock
          default: 0
      required:
        - sku
        - name
        - categoryId
        - unit
    StockItemUpdate:
      description: "Changes to a stock item, as a JSON Merge Patch: send only the fields that change. The quantity isn't here; record a stock movement instead."
      type: object
      properties:
        sku:
          type: string
          pattern: ^[A-Z0-9-]{3,32}$
          description: "Stock keeping unit: upper-case letters, digits, and hyphens. Unique among items that aren't deleted."
          examples:
            - BOX-S-001
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - "null"
          maxLength: 2000
        categoryId:
          type: string
          format: uuid
        unit:
          type: string
          enum:
            - piece
            - box
            - roll
            - pack
          description: What quantities count. It can't change once the item has stock movements.
        reorderPoint:
          type: integer
          minimum: 0
          maximum: 1000000
          description: At or below this quantity, the item is low on stock
      minProperties: 1
    StockMovement:
      description: One change to an item's quantity on hand. Movements can't be changed or deleted; record a count to correct a mistake.
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - receipt
            - issue
            - count
          description: "`receipt` adds stock, `issue` takes it out, `count` sets it to what was counted"
        quantity:
          type: integer
          minimum: 0
          description: "As entered: the amount received or issued, or the counted quantity"
        quantityChange:
          type: integer
          description: "How the quantity on hand changed: positive or negative"
        quantityAfter:
          type: integer
          minimum: 0
          description: Quantity on hand after this movement
        reference:
          type:
            - string
            - "null"
          maxLength: 64
          description: Delivery note, order, or ticket number
        note:
          type:
            - string
            - "null"
          maxLength: 500
        createdBy:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
          description: Who recorded it
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - quantity
        - quantityChange
        - quantityAfter
        - reference
        - note
        - createdBy
        - createdAt
    StockMovementInput:
      description: A stock movement to record.
      type: object
      properties:
        type:
          type: string
          enum:
            - receipt
            - issue
            - count
          description: "`receipt` adds stock, `issue` takes it out, `count` sets it to what was counted"
        quantity:
          type: integer
          minimum: 0
          maximum: 1000000
          description: At least 1 for receipts and issues
        reference:
          type:
            - string
            - "null"
          maxLength: 64
          description: Delivery note, order, or ticket number
        note:
          type:
            - string
            - "null"
          maxLength: 500
      required:
        - type
        - quantity
    User:
      description: A person who can sign in.
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
          description: Unique, ignoring case
        role:
          type: string
          enum:
            - admin
            - staff
          description: Admins can also delete stock items
        emailVerified:
          type: boolean
          description: Users can sign in once their email is verified
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - emailVerified
        - createdAt
    ValidationProblem:
      description: "A 422 problem: some fields of the request body are invalid."
      type: object
      properties:
        type:
          type: string
          format: uri
          description: "Identifies the kind of problem. It's stable: branch on it."
          examples:
            - https://api.inventory.example/problems/validation-failed
        title:
          type: string
          description: Short summary of the kind of problem
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code
        detail:
          type: string
          description: What went wrong this time, in words for people
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence. Quote it when reporting a problem.
        errors:
          type: array
          minItems: 1
          description: One entry per invalid field
          items:
            type: object
            properties:
              pointer:
                type: string
                description: JSON Pointer (RFC 6901) to the field in the request body, as a URI fragment like `#/email`
                examples:
                  - "#/email"
              detail:
                type: string
                description: What's wrong with it
            required:
              - pointer
              - detail
      required:
        - type
        - title
        - status
        - errors
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /auth/login or POST /auth/refresh. It expires after 15 minutes.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly cookie set by POST /auth/login and replaced by POST /auth/refresh.
