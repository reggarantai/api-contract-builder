openapi: 3.1.0
info:
  title: Inventory App
  version: 1.0.0
  description: |-
    Stock tracking for the warehouse team: accounts and sign-in, stock items, and stock movements.

    Every endpoint follows these conventions:

    - **Errors** are problem details ([RFC 9457](https://www.rfc-editor.org/rfc/rfc9457)) in `application/problem+json`; branch on `type`. 400 means invalid query or header parameters, 422 invalid body fields (listed in `errors`), and 404 an unknown or deleted ID. Other errors, like 415 or 500, are problem details too.
    - **Authentication**: send `Authorization: Bearer <access token>`. A 401 means the token is missing or expired: refresh once with `POST /auth/refresh`, then retry. If refreshing answers 401, sign in again.
    - **Paged lists** return `{ data, meta }` and take `page` and `pageSize`. Short lists return `{ data }`.
    - **Creates** take an `Idempotency-Key` header, so a retry never creates something twice.
    - **Requests** send JSON. PATCH sends a JSON Merge Patch (`application/merge-patch+json`).
    - **Responses** send `Cache-Control: no-store`.
    - **CORS** allows only the app's origin, with credentials. It exposes `Location` and `Retry-After` to scripts, and allows the `Idempotency-Key` request header.
    - **Times** are UTC, in RFC 3339 format.
servers:
  - url: https://api.inventory.example/v1
    description: Production
  - url: https://api.inventory-staging.example/v1
    description: Staging — Reset every night. A separate site, so cookies never cross between staging and production.
tags:
  - name: Login
    description: Everyone who works with stock signs in here. Links to Registration and Forgot password.
  - name: Registration
    description: New staff create an account with their work email.
  - name: Verify email
    description: "Opens from the link in the verification email: `/verify-email?token=…`."
  - name: Forgot password
    description: Sends a link to set a new password.
  - name: Reset password
    description: "Opens from the link in the reset email: `/reset-password?token=…`."
  - name: App shell
    description: "The layout around every signed-in page: navigation, the user menu, and keeping the session alive. It isn't a screen of its own, but its calls happen on every page."
  - name: Stock list
    description: All stock items, with search, filters, and pages. Items low on stock or out of stock stand out.
  - name: Stock item
    description: One item, with its movement history. The warehouse records deliveries, issues, and stock counts here.
  - name: Add or edit stock item
    description: "One form for both: `/stock-items/new` adds an item and `/stock-items/{id}/edit` changes one. The quantity isn't on the form: new items start at 0, and movements change it."
security:
  - bearerAuth: []
paths:
  /auth/forgot-password:
    post:
      operationId: postAuthForgotPassword
      summary: Email a password reset link
      description: The link works once, for 1 hour. Always answers 202, so it doesn't show which emails have accounts.
      tags:
        - Forgot password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
              required:
                - email
            examples:
              email:
                value:
                  email: ana@example.com
      responses:
        "202":
          description: Accepted
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
              examples:
                invalid-email:
                  value:
                    type: https://api.inventory.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields are invalid.
                    errors:
                      - pointer: "#/email"
                        detail: Enter an email address.
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before trying again
              schema:
                type: integer
                minimum: 1
                examples:
                  - 60
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                too-many-requests:
                  value:
                    type: https://api.inventory.example/problems/too-many-requests
                    title: Too many requests
                    status: 429
                    detail: Wait a minute before asking for another email.
      x-status: draft
      x-pages:
        - page: Forgot password
          slug: forgot-password
          trigger: on_submit
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Sign in
      description: "Returns an access token and sets the refresh token cookie. A session lasts 12 hours, or 30 days with `remember`, from sign-in; refreshing doesn't make it longer. Wrong credentials answer 400, not 401: a 401 always means the access token is missing or expired."
      tags:
        - Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  maxLength: 128
                remember:
                  type: boolean
                  description: Keep the session for 30 days instead of 12 hours
              required:
                - email
                - password
            examples:
              valid:
                value:
                  email: ana@example.com
                  password: correct-horse-battery
                  remember: true
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              required: true
              description: The refresh token. With `remember`, `Max-Age` keeps it for the session's 30 days; without, it's a browser-session cookie.
              schema:
                type: string
                examples:
                  - refresh_token=rt_5Jx2mQ9vL0aR; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth; Max-Age=2592000
            Cache-Control:
              required: true
              description: Tokens must never be stored by a cache (RFC 6749)
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                signed-in:
                  value:
                    accessToken: eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiIwYjVjMmQ0ZSJ9.c2ln
                    tokenType: Bearer
                    expiresIn: 900
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                wrong-password:
                  value:
                    type: https://api.inventory.example/problems/invalid-credentials
                    title: Invalid credentials
                    status: 400
                    detail: Email or password is wrong.
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                not-verified:
                  value:
                    type: https://api.inventory.example/problems/email-not-verified
                    title: Email not verified
                    status: 403
                    detail: Verify your email address first. We sent a link to budi@example.com.
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
              examples:
                invalid-email:
                  value:
                    type: https://api.inventory.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields are invalid.
                    errors:
                      - pointer: "#/email"
                        detail: Enter an email address.
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before trying again
              schema:
                type: integer
                minimum: 1
                examples:
                  - 900
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                too-many-attempts:
                  value:
                    type: https://api.inventory.example/problems/too-many-attempts
                    title: Too many attempts
                    status: 429
                    detail: Too many sign-in attempts. Try again in 15 minutes.
      x-status: agreed
      x-notes-fe: "Keep the access token in memory, not in localStorage. Send API requests with `credentials: 'include'` so the browser keeps the cookie."
      x-notes-be: "Answer 400 for unknown emails too, and hash the password for them as well, so neither the answer nor its timing shows who has an account. Answer 403 only once the password matched. Throttle failed attempts per email and per IP address, unknown emails included, instead of locking accounts: a lock would let anyone lock a colleague out."
      x-pages:
        - page: Login
          slug: login
          trigger: on_submit
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Sign out
      description: Revokes the refresh token in the cookie, if there is one, and clears the cookie. Always answers 204, so signing out can't fail.
      tags:
        - App shell
      security: []
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              required: true
              description: Clears the refresh token cookie
              schema:
                type: string
                examples:
                  - refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth; Max-Age=0
      x-status: agreed
      x-notes-fe: The access token works until it expires, so drop it from memory, even if this request fails.
      x-notes-be: Only revoke when the request's `Origin` is the app.
      x-pages:
        - page: App shell
          slug: app-shell
          trigger: on_action
          note: Sign out, in the user menu
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: Get a new access token
      description: Exchanges the refresh token cookie for a new access token, and replaces the cookie. The session still ends 12 hours, or 30 days, after sign-in.
      tags:
        - App shell
      security:
        - refreshCookie: []
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              required: true
              description: The new refresh token, with the same attributes. `Max-Age`, if set, is the time left in the session.
              schema:
                type: string
                examples:
                  - refresh_token=rt_8Kd3nW1pZ7bT; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth; Max-Age=2505600
            Cache-Control:
              required: true
              description: Tokens must never be stored by a cache (RFC 6749)
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                refreshed:
                  value:
                    accessToken: eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiIwYjVjMmQ0ZSJ9.bmV3
                    tokenType: Bearer
                    expiresIn: 900
        "401":
          description: Unauthorized
          headers:
            Set-Cookie:
              required: true
              description: Clears the refresh token cookie
              schema:
                type: string
                examples:
                  - refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth; Max-Age=0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                session-expired:
                  value:
                    type: https://api.inventory.example/problems/session-expired
                    title: Session expired
                    status: 401
                    detail: Sign in again.
      x-status: agreed
      x-notes-fe: "Call it directly, not through the code that refreshes on 401. Run one refresh at a time, across tabs too (e.g. with the Web Locks API): requests that get a 401 meanwhile wait for it, then retry once."
      x-notes-be: Rotate the refresh token on every use. Accept the previous token for 30 seconds after it's replaced, since tabs can refresh at the same moment; after that, a reused token was probably stolen, so revoke every session of the user. Only accept requests whose `Origin` is the app.
      x-pages:
        - page: App shell
          slug: app-shell
          trigger: on_load
          note: When there's no access token in memory yet, e.g. after a reload
        - page: App shell
          slug: app-shell
          trigger: other
          note: A minute before the access token expires, or once after a 401
  /auth/register:
    post:
      operationId: postAuthRegister
      summary: Create an account
      description: Always answers 202, whether or not the email has an account, so it doesn't show who has one. A new account gets a link to verify the address. An existing account gets an email saying so, with links to sign in and to reset the password; an unverified one gets a new link.
      tags:
        - Registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
                  description: At least 12 characters, and not in known data breaches
              required:
                - name
                - email
                - password
            examples:
              new-user:
                value:
                  name: Budi Santoso
                  email: budi@example.com
                  password: correct-horse-battery
      responses:
        "202":
          description: Accepted
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
              examples:
                short-password:
                  value:
                    type: https://api.inventory.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields are invalid.
                    errors:
                      - pointer: "#/password"
                        detail: Use at least 12 characters.
                breached-password:
                  value:
                    type: https://api.inventory.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields are invalid.
                    errors:
                      - pointer: "#/password"
                        detail: This password appeared in a data breach. Choose another.
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before trying again
              schema:
                type: integer
                minimum: 1
                examples:
                  - 60
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                too-many-requests:
                  value:
                    type: https://api.inventory.example/problems/too-many-requests
                    title: Too many requests
                    status: 429
                    detail: Wait a minute before asking for another email.
      x-status: agreed
      x-notes-be: The verification link works for 24 hours. New accounts get the staff role; admins are promoted outside this app. Check passwords against known breached passwords (NIST SP 800-63B).
      x-pages:
        - page: Registration
          slug: registration
          trigger: on_submit
  /auth/reset-password:
    post:
      operationId: postAuthResetPassword
      summary: Set a new password
      description: "The token comes from the link in the reset email: `/reset-password?token=…`. Ends every session of the user: refresh tokens stop working at once, and access tokens already issued expire within 15 minutes."
      tags:
        - Reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
                  description: At least 12 characters, and not in known data breaches
              required:
                - token
                - password
            examples:
              new-password:
                value:
                  token: pr_7Tb2vX9kM4
                  password: staple-battery-horse
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalid-link:
                  value:
                    type: https://api.inventory.example/problems/invalid-link
                    title: Invalid or expired link
                    status: 400
                    detail: This link is invalid or has expired. Ask for a new one.
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
              examples:
                short-password:
                  value:
                    type: https://api.inventory.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields are invalid.
                    errors:
                      - pointer: "#/password"
                        detail: Use at least 12 characters.
                breached-password:
                  value:
                    type: https://api.inventory.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields are invalid.
                    errors:
                      - pointer: "#/password"
                        detail: This password appeared in a data breach. Choose another.
      x-status: draft
      x-notes-be: Store reset tokens hashed. Revoke every refresh token of the user.
      x-pages:
        - page: Reset password
          slug: reset-password
          trigger: on_submit
          note: Token from the `token` query parameter
  /auth/verify-email:
    post:
      operationId: postAuthVerifyEmail
      summary: Verify an email address
      description: "The token comes from the link in the verification email: `/verify-email?token=…`. A link that was already used answers 204 again while its account stays verified, so opening it twice, or an email scanner opening it first, isn't an error."
      tags:
        - Verify email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
              required:
                - token
            examples:
              from-link:
                value:
                  token: ev_3Hq8sK2wN6
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalid-link:
                  value:
                    type: https://api.inventory.example/problems/invalid-link
                    title: Invalid or expired link
                    status: 400
                    detail: This link is invalid or has expired. Ask for a new one.
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
              examples:
                missing-token:
                  value:
                    type: https://api.inventory.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields are invalid.
                    errors:
                      - pointer: "#/token"
                        detail: Send the token from the link.
      x-status: review
      x-notes-be: Store link tokens hashed.
      x-pages:
        - page: Verify email
          slug: verify-email
          trigger: on_load
          note: Token from the `token` query parameter
  /auth/verify-email/resend:
    post:
      operationId: postAuthVerifyEmailResend
      summary: Send a new verification email
      description: Always answers 202, so it doesn't show which emails have accounts. An account that's already verified gets an email saying so, with a link to sign in; an unknown email gets nothing.
      tags:
        - Login
        - Verify email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
              required:
                - email
            examples:
              email:
                value:
                  email: budi@example.com
      responses:
        "202":
          description: Accepted
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
              examples:
                invalid-email:
                  value:
                    type: https://api.inventory.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields are invalid.
                    errors:
                      - pointer: "#/email"
                        detail: Enter an email address.
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before trying again
              schema:
                type: integer
                minimum: 1
                examples:
                  - 60
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                too-many-requests:
                  value:
                    type: https://api.inventory.example/problems/too-many-requests
                    title: Too many requests
                    status: 429
                    detail: Wait a minute before asking for another email.
      x-status: review
      x-pages:
        - page: Login
          slug: login
          trigger: on_action
          note: When the email isn't verified yet
        - page: Verify email
          slug: verify-email
          trigger: on_submit
          note: When the link is invalid or expired
  /categories:
    get:
      operationId: getCategories
      summary: List categories
      description: All categories, by name. There are few, so there are no pages.
      tags:
        - Stock list
        - Add or edit stock item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
                required:
                  - data
              examples:
                three:
                  value:
                    data:
                      - id: c8e2a4b6-3d5f-4a7c-9e1b-2f4d6a8c0e3b
                        name: Cleaning supplies
                      - id: 6f1c2b9e-0b7a-4c64-9a8e-2f1d3c4b5a69
                        name: Packaging
                      - id: a3d5f7b9-1c2e-4f6a-8b0d-9e7c5a3b1d2f
                        name: Spare parts
        "401":
          description: Unauthorized
          headers:
            WWW-Authenticate:
              required: true
              description: The Bearer challenge (RFC 6750). It adds `error="invalid_token"` when the token sent is expired or invalid.
              schema:
                type: string
                examples:
                  - Bearer realm="inventory", error="invalid_token", error_description="The access token expired"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                token-expired:
                  value:
                    type: https://api.inventory.example/problems/token-expired
                    title: Access token expired
                    status: 401
                    detail: Refresh the access token and try again.
                unauthenticated:
                  value:
                    type: https://api.inventory.example/problems/unauthenticated
                    title: Not signed in
                    status: 401
                    detail: Send an access token in the Authorization header.
      x-status: agreed
      x-pages:
        - page: Stock list
          slug: stock-list
          trigger: on_load
          note: Category filter
        - page: Add or edit stock item
          slug: add-or-edit-stock-item
          trigger: on_load
          note: Category select
  /me:
    get:
      operationId: getMe
      summary: Current user
      tags:
        - App shell
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                ana:
                  value:
                    id: 0b5c2d4e-8f1a-4b3c-9d2e-7a6f5e4d3c2b
                    name: Ana Lima
                    email: ana@example.com
                    role: admin
                    emailVerified: true
                    createdAt: 2026-03-02T09:00:00Z
        "401":
          description: Unauthorized
          headers:
            WWW-Authenticate:
              required: true
              description: The Bearer challenge (RFC 6750). It adds `error="invalid_token"` when the token sent is expired or invalid.
              schema:
                type: string
                examples:
                  - Bearer realm="inventory", error="invalid_token", error_description="The access token expired"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                token-expired:
                  value:
                    type: https://api.inventory.example/problems/token-expired
                    title: Access token expired
                    status: 401
                    detail: Refresh the access token and try again.
                unauthenticated:
                  value:
                    type: https://api.inventory.example/problems/unauthenticated
                    title: Not signed in
                    status: 401
                    detail: Send an access token in the Authorization header.
      x-status: agreed
      x-pages:
        - page: App shell
          slug: app-shell
          trigger: on_load
          note: Name and role for the user menu
  /stock-items:
    get:
      operationId: getStockItems
      summary: List stock items
      tags:
        - Stock list
      parameters:
        - name: q
          in: query
          description: Matches the SKU or name, ignoring case
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          description: Only items in this category. An unknown ID gives an empty list.
          schema:
            type: string
            format: uuid
        - name: stockStatus
          in: query
          description: Only items with this stock status
          schema:
            type: string
            enum:
              - in_stock
              - low_stock
              - out_of_stock
        - name: sort
          in: query
          description: Sort by this field; a leading `-` sorts descending. Ties are broken by `id`, so pages don't overlap.
          schema:
            type: string
            enum:
              - name
              - -name
              - sku
              - -sku
              - quantityOnHand
              - -quantityOnHand
              - updatedAt
              - -updatedAt
            default: name
        - name: page
          in: query
          description: Page number, from 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StockItem"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
                required:
                  - data
                  - meta
              examples:
                first-page:
