openapi: 3.1.0
info:
  title: Inventory App
  version: 1.2.0
  description: Stock and warehouse API.
servers:
  - url: https://api.inventory.example/v1
    description: Production
  - url: https://staging.inventory.example/v1
    description: Staging — Reset every night
tags:
  - name: Login
    description: Users sign in with their email and password.
  - name: Registration
    description: New users create an account with their work email.
  - name: Stock list
    description: All items with their quantity. Items with no stock are highlighted.
  - name: Create schedule
    description: Plans recurring restock deliveries from a supplier.
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Sign in
      description: After 5 wrong passwords in a row the account is locked for 15 minutes.
      tags:
        - Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                remember:
                  type: boolean
                  description: Keep the session for 30 days
            examples:
              valid:
                value:
                  email: ana@example.com
                  password: correct-horse
                  remember: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - user
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
              examples:
                signed-in:
                  value:
                    token: eyJhbGciOi...
                    user:
                      id: 0b5c2d4e-8f1a-4b3c-9d2e-7a6f5e4d3c2b
                      name: Ana Lima
                      email: ana@example.com
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                wrong-password:
                  value:
                    message: Email or password is wrong. 4 attempts left.
                    code: WRONG_PASSWORD
        "423":
          description: Account locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                locked:
                  value:
                    message: Too many attempts. Try again in 15 minutes.
                    code: ACCOUNT_LOCKED
      x-status: agreed
      x-notes-fe: Keep the email after an error.
      x-pages:
        - page: Login
          slug: login
          trigger: on_submit
          note: Show errors inline
  /auth/register:
    post:
      operationId: postAuthRegister
      summary: Create an account
      tags:
        - Registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
            examples:
              new-user:
                value:
                  name: Ana Lima
                  email: ana@example.com
                  password: correct-horse
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                created:
                  value:
                    id: 0b5c2d4e-8f1a-4b3c-9d2e-7a6f5e4d3c2b
                    name: Ana Lima
                    email: ana@example.com
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                email-taken:
                  value:
                    message: An account with this email already exists.
                    code: EMAIL_TAKEN
      x-status: review
      x-notes-be: Send a welcome email after creating the account.
      x-pages:
        - page: Registration
          slug: registration
          trigger: on_submit
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: For monitoring. No page uses it and it has no example, so the Export tab warns about both.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
      x-status: draft
  /me:
    get:
      operationId: getMe
      summary: Current user
      tags:
        - Login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                ana:
                  value:
                    id: 0b5c2d4e-8f1a-4b3c-9d2e-7a6f5e4d3c2b
                    name: Ana Lima
                    email: ana@example.com
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                signed-out:
                  value:
                    message: Sign in first.
      x-status: agreed
      x-pages:
        - page: Login
          slug: login
          trigger: on_load
          note: Skip the page when already signed in
  /schedules:
    post:
      operationId: postSchedules
      summary: Create a restock schedule
      tags:
        - Create schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - supplierId
                - sku
                - quantity
                - firstDelivery
                - repeat
              properties:
                supplierId:
                  type: string
                  format: uuid
                sku:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                firstDelivery:
                  type: string
                  format: date
                repeat:
                  type: string
                  enum:
                    - once
                    - weekly
                    - monthly
                note:
                  type:
                    - string
                    - "null"
                  maxLength: 500
            examples:
              weekly:
                value:
                  supplierId: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                  sku: SKU-002
                  quantity: 50
                  firstDelivery: 2026-11-15
                  repeat: weekly
                  note: null
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
              examples:
                created:
                  value:
                    id: 4d3c2b1a-0f9e-4d8c-b7a6-5f4e3d2c1b0a
                    supplierId: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                    sku: SKU-002
                    quantity: 50
                    firstDelivery: 2026-11-15
                    repeat: weekly
                    note: null
        "422":
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                past-date:
                  value:
                    message: The first delivery must be in the future.
                    code: DATE_IN_PAST
      x-status: draft
      x-notes-fe: Only offer items whose supplier is set.
      x-pages:
        - page: Create schedule
          slug: create-schedule
          trigger: on_submit
  /stocks:
    get:
      operationId: getStocks
      summary: List stock items
      tags:
        - Stock list
        - Create schedule
      parameters:
        - name: page
          in: query
          description: Page number, from 1
          schema:
            type: integer
            minimum: 1
        - name: category
          in: query
          description: Only items in this category
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Matches SKU or name
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stock"
              examples:
                two-items:
                  summary: Two items
                  value:
                    - sku: SKU-001
                      name: Widget
                      quantity: 12
                      category:
                        id: 6f1c2b9e-0b7a-4c64-9a8e-2f1d3c4b5a69
                        name: Parts
                        parent: null
                      tags:
                        - metal
                    - sku: SKU-002
                      name: Gadget
                      quantity: 0
                empty:
                  summary: No items yet
                  value: []
      x-status: agreed
      x-pages:
        - page: Stock list
          slug: stock-list
          trigger: on_load
        - page: Create schedule
          slug: create-schedule
          trigger: on_load
          note: Fill the item list
  /stocks/{sku}:
    delete:
      operationId: deleteStocksBySku
      summary: Remove a stock item
      tags:
        - Stock list
      parameters:
        - name: sku
          in: path
          required: true
          description: Stock keeping unit
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not-found:
                  value:
                    message: No item SKU-999
      x-status: review
      x-pages:
        - page: Stock list
          slug: stock-list
          trigger: on_action
          note: Delete button in each row
  /suppliers:
    get:
      operationId: getSuppliers
      summary: List suppliers
      tags:
        - Create schedule
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
              examples:
                one-supplier:
                  value:
                    - id: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                      name: Acme Supplies
                      email: orders@acme.example
      x-status: draft
      x-pages:
        - page: Create schedule
          slug: create-schedule
          trigger: on_load
          note: Fill the supplier list
components:
  schemas:
    Category:
      description: A group of stock items.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent:
          anyOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
          description: Stable code to branch on, e.g. ACCOUNT_LOCKED
    Schedule:
      description: Recurring deliveries of one item from one supplier.
      type: object
      required:
        - id
        - supplierId
        - sku
        - quantity
        - firstDelivery
        - repeat
      properties:
        id:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        firstDelivery:
          type: string
          format: date
        repeat:
          type: string
          enum:
            - once
            - weekly
            - monthly
        note:
          type:
            - string
            - "null"
          maxLength: 500
    Stock:
      description: An item in stock.
      type: object
      required:
        - sku
        - name
        - quantity
      properties:
        sku:
          type: string
          pattern: ^[A-Z0-9-]+$
          examples:
            - SKU-001
        name:
          type: string
          maxLength: 120
        quantity:
          type: integer
          minimum: 0
        category:
          $ref: "#/components/schemas/Category"
        tags:
          type: array
          items:
            type: string
          uniqueItems: true
    Supplier:
      description: A company that delivers stock.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    User:
      description: A person who can sign in.
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from POST /auth/login
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: For server-to-server calls
