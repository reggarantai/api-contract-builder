openapi: 3.1.0
info:
  title: Events API
  version: "1.0"
  description: "Everything about events: listing, creating, cancelling, and the tickets people hold."
servers:
  - url: https://api.events.example
    description: Production — Main region
security:
  - oidc: []
paths:
  /admin/purge:
    delete:
      operationId: purge
      summary: Delete past events
      security: []
      responses:
        "204":
          description: Purged
      x-status: draft
  /events:
    get:
      operationId: listEvents
      summary: List events
      security: []
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
      x-status: draft
    post:
      operationId: createEvent
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
            examples:
              conference:
                value:
                  name: NodeConf
                  startsAt: 2026-05-04T09:00:00Z
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
      x-status: draft
  /events/{eventId}:
    get:
      operationId: getEvent
      summary: Get an event
      parameters:
        - name: eventId
          in: path
          required: true
          description: The event's ID, from its URL
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
              examples:
                conference:
                  summary: A conference
                  value:
                    id: 6f1c2b9e-0b7a-4c64-9a8e-2f1d3c4b5a69
                    name: NodeConf
                    startsAt: 2026-05-04T09:00:00Z
                    endsAt: null
                    kind: conference
        "404":
          description: No such event
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                event-not-found:
                  $ref: "#/components/examples/event-not-found"
      x-status: draft
    put:
      operationId: replaceEvent
      summary: Replace an event
      parameters:
        - name: eventId
          in: path
          required: true
          description: The event's ID, from its URL
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: The event, replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: No such event
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                event-not-found:
                  $ref: "#/components/examples/event-not-found"
        "409":
          description: The event is full
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                over-capacity:
                  summary: Fewer seats than tickets sold
                  value:
                    type: https://events.example/problems/event-full
                    title: Event full
                    status: 409
                    detail: 120 tickets are sold, so the room can't hold fewer seats.
      x-status: draft
  /events/{eventId}/tickets:
    get:
      operationId: listTickets
      summary: List an event's tickets
      parameters:
        - name: eventId
          in: path
          required: true
          description: The event's ID
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          description: Which tickets, as JSON
          schema:
            type: object
            properties:
              holder:
                type: string
      responses:
        2XX:
          description: The tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        default:
          description: Anything else, as a problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      x-status: draft
  /events/{eventId}:cancel:
    post:
      operationId: cancelEvent
      summary: Cancel an event
      parameters:
        - name: eventId
          in: path
          required: true
          description: The event's ID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cancelled
        "404":
          description: No such event
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                event-not-found:
                  $ref: "#/components/examples/event-not-found"
        "409":
          description: The event already happened
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                event-full:
                  $ref: "#/components/examples/event-full"
      x-status: draft
  /public/feed:
    get:
      operationId: publicFeed
      summary: Upcoming events, for everyone
      security:
        - oidc: []
      responses:
        "200":
          description: The feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
      x-status: draft
  /reports:
    get:
      operationId: getReport
      summary: Download the sales report
      security:
        - apiKey: []
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                type: object
      x-status: draft
components:
  schemas:
    Anything: {}
    Event:
      description: An event people can buy tickets for.
      type: object
      required:
        - id
        - name
        - startsAt
        - kind
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          examples:
            - NodeConf
        startsAt:
          type: string
          format: date-time
        endsAt:
          type:
            - string
            - "null"
          format: date-time
        kind:
          const: conference
        price:
          $ref: "#/components/schemas/Money"
          description: What a ticket costs
        tags:
          type: array
          prefixItems:
            - type: string
          items: false
        slot:
          $ref: "#/components/schemas/Slot"
        extra:
          $ref: "#/components/schemas/Anything"
      unevaluatedProperties: false
      dependentRequired:
        endsAt:
          - startsAt
    EventInput:
      type: object
      required:
        - name
        - startsAt
      properties:
        name:
          type: string
          minLength: 1
        startsAt:
          type: string
          format: date-time
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Slot:
      $id: https://events.example/schemas/slot
      type: object
      properties:
        from:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
        to:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
      $defs:
        time:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
    Ticket:
      type: object
      properties:
        id:
          type: string
        holder:
          type:
            - string
            - "null"
  examples:
    event-not-found:
      summary: Event not found
      description: No event has this ID, or it was deleted.
      value:
        type: https://events.example/problems/event-not-found
        title: Event not found
        status: 404
    event-full:
      summary: Event full
      value:
        type: https://events.example/problems/event-full
        title: Event full
        status: 409
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      description: "OpenID Connect: https://auth.events.example/.well-known/openid-configuration"
    apiKey:
      type: apiKey
      in: query
      name: key
    basic:
      type: http
      scheme: basic
