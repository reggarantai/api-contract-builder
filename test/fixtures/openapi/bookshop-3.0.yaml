# A made-up OpenAPI 3.0 document that uses what real ones do, including the
# parts API Contract Builder can't hold. Frozen: never change it, since the
# import tests compare what it becomes with golden files.
openapi: 3.0.3
info:
  title: Bookshop API
  version: "2.4.0"
  description: |
    Books, authors, and orders for the Bookshop app.

    Errors are problem details (RFC 9457) in `application/problem+json`.
  termsOfService: https://bookshop.example/terms
  contact:
    name: API team
    email: api@bookshop.example
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-logo:
    url: https://bookshop.example/logo.png
externalDocs:
  description: Guides
  url: https://docs.bookshop.example
servers:
  - url: https://{region}.api.bookshop.example/v2
    description: Production
    variables:
      region:
        default: eu
        enum:
          - eu
          - us
  - url: /v2
    description: The API on the app's own origin, which the web frontend calls
tags:
  - name: books
    description: Books in the catalog
  - name: orders
    externalDocs:
      url: https://docs.bookshop.example/orders
security:
  - bearerAuth: []
paths:
  /books:
    get:
      tags:
        - books
      operationId: listBooks
      summary: List books
      description: Books in the catalog, newest first.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: genre
          in: query
          description: Only books of these genres
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Genre"
        - name: q
          in: query
          description: Words in the title or the author's name
          schema:
            type: string
            maxLength: 100
          example: tolkien
        - name: Accept
          in: header
          schema:
            type: string
        - name: session
          in: cookie
          schema:
            type: string
      responses:
        "200":
          description: A page of books
          headers:
            X-Total-Count:
              description: How many books match
              schema:
                type: integer
                minimum: 0
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Book"
              examples:
                first-page:
                  summary: The first page
                  value:
                    data:
                      - id: 6f1c2b9e-0b7a-4c64-9a8e-2f1d3c4b5a69
                        title: The Hobbit
                        subtitle: null
                        price: 12.5
                        genre: fiction
          links:
            GetFirstBook:
              operationId: getBook
              parameters:
                bookId: $response.body#/data/0/id
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - books
      operationId: createBook
      summary: Add a book
      security:
        - bearerAuth: []
        - apiKey: []
      requestBody:
        $ref: "#/components/requestBodies/BookInput"
      callbacks:
        bookIndexed:
          "{$request.body#/callbackUrl}":
            post:
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
              responses:
                "204":
                  description: Received
      responses:
        "201":
          description: Created
          headers:
            Location:
              required: true
              description: Where the new book is
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
              example:
                id: 6f1c2b9e-0b7a-4c64-9a8e-2f1d3c4b5a69
                title: The Hobbit
                subtitle: null
                price: 12.5
                genre: fiction
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                isbn-taken:
                  $ref: "#/components/examples/isbn-taken"
        "422":
          description: Invalid fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
              examples:
                missing-title:
                  value:
                    type: https://bookshop.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    errors:
                      - pointer: "#/title"
                        detail: Enter a title.
        4XX:
          description: Another client error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Unexpected"
  /books/{bookId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      operationId: getBook
      summary: Get a book
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateBook
      summary: Change a book
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/BookPatch"
      responses:
        "200":
          description: The changed book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBook
      summary: Remove a book
      security:
        - oauth:
            - books:delete
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"
    trace:
      operationId: traceBook
      responses:
        "200":
          description: The request, echoed
  /books/{bookId}/cover:
    get:
      operationId: getCover
      summary: Get a book's cover
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: The cover image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /authors/{author-id}:
    get:
      operationId: authors.get-one
      summary: Get an author
      deprecated: true
      x-codegen-name: getAuthor
      parameters:
        - name: author-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The author
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
              examples:
                tolkien:
                  $ref: "#/components/examples/author-tolkien"
  /orders:
    post:
      tags:
        - orders
      operationId: placeOrder
      summary: Place an order
      security:
        - oauth:
            - orders:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OrderInput"
            encoding:
              bookIds:
                style: form
                explode: true
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /health:
    get:
      operationId: health
      summary: Is the API up?
      security: []
      responses:
        "200":
          description: Up
components:
  schemas:
    Genre:
      type: string
      enum:
        - fiction
        - non-fiction
        - poetry
    Book:
      description: A book in the catalog.
      type: object
      required:
        - id
        - title
        - price
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: The Hobbit
        subtitle:
          type: string
          nullable: true
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
        discount:
          type: number
          maximum: 100
          exclusiveMaximum: false
        genre:
          $ref: "#/components/schemas/Genre"
        author:
          description: Null for anonymous works
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Author"
        format:
          oneOf:
            - $ref: "#/components/schemas/Ebook"
            - $ref: "#/components/schemas/Paperback"
          discriminator:
            propertyName: kind
            mapping:
              ebook: "#/components/schemas/Ebook"
              paperback: "#/components/schemas/Paperback"
        status:
          type: string
          nullable: true
          enum:
            - draft
            - published
      x-internal-id: book
    BookPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        subtitle:
          type: string
          nullable: true
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
    BookAlias:
      $ref: "#/components/schemas/Book"
      description: The same as a book; kept for older clients
      maxLength: 3
    Author:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        born:
          type: string
          format: date
          nullable: true
    Ebook:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - ebook
        sizeBytes:
          type: integer
          format: int64
          maximum: 9223372036854775807
    Paperback:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - paperback
        pages:
          type: integer
          minimum: 1
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  pointer:
                    type: string
                  detail:
                    type: string
    OrderInput:
      type: object
      required:
        - bookIds
      properties:
        bookIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    Order:
      type: object
      properties:
        id:
          type: string
        total:
          type: number
  parameters:
    Page:
      name: page
      in: query
      description: Which page, from 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    BookId:
      name: bookId
      in: path
      required: true
      description: The book's ID
      schema:
        type: string
        format: uuid
    Unused:
      name: unused
      in: query
      schema:
        type: string
  responses:
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            not-found:
              $ref: "#/components/examples/not-found"
    Unauthorized:
      description: The access token is missing or expired
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
          example: Bearer realm="bookshop"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unauthenticated:
              $ref: "#/components/examples/unauthenticated"
    Unexpected:
      description: Something went wrong
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  requestBodies:
    BookInput:
      required: true
      description: The book to add
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Book"
          examples:
            hobbit:
              summary: A novel
              description: The usual case
              value:
                title: The Hobbit
                price: 12.5
                genre: fiction
            from-file:
              externalValue: https://bookshop.example/examples/book.json
  headers:
    RateLimitRemaining:
      description: Requests left in this minute
      schema:
        type: integer
        minimum: 0
  examples:
    isbn-taken:
      summary: ISBN already used
      description: Another book has this ISBN.
      value:
        type: https://bookshop.example/problems/isbn-taken
        title: ISBN already used
        status: 409
        detail: 978-0-261-10221-7 is already used by The Hobbit.
    not-found:
      summary: Not found
      value:
        type: https://bookshop.example/problems/not-found
        title: Not found
        status: 404
    unauthenticated:
      summary: Not signed in
      value:
        type: https://bookshop.example/problems/unauthenticated
        title: Not signed in
        status: 401
    author-tolkien:
      summary: An author
      value:
        id: 0b5c2d4e-8f1a-4b3c-9d2e-7a6f5e4d3c2b
        name: J. R. R. Tolkien
        born: "1892-01-03"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    oauth:
      type: oauth2
      description: For partner apps
      flows:
        authorizationCode:
          authorizationUrl: https://auth.bookshop.example/authorize
          tokenUrl: https://auth.bookshop.example/token
          scopes:
            books:delete: Remove books
            orders:write: Place orders
